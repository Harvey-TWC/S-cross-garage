<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S-Cross Garage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: auto;
            padding: 24px 18px;
        }

        .header {
            margin-bottom: 24px;
        }

        .brand {
            font-size: 14px;
            color: #999;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 32px;
            margin-top: 5px;
        }

        .car-name {
            color: #aaa;
            margin-top: 4px;
        }

        .mileage-card {
            background: #1c1c1c;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .label {
            color: #999;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .mileage {
            font-size: 42px;
            font-weight: 700;
        }

        .unit {
            font-size: 15px;
            color: #999;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: #1c1c1c;
            border-radius: 16px;
            padding: 20px;
            min-height: 120px;
        }

        .icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-text {
            color: #999;
            font-size: 13px;
            margin-top: 6px;
        }

        .section {
            margin-top: 24px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .expense {
            background: #1c1c1c;
            border-radius: 16px;
            padding: 20px;
        }

        .expense-value {
            font-size: 28px;
            font-weight: 700;
        }

        .expense-label {
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="brand">SUZUKI</div>
        <h1>S-CROSS</h1>
        <div class="car-name">Garage / 車況紀錄</div>
    </div>

    <div class="mileage-card">
        <div class="label">目前里程</div>
        <div class="mileage">
            25,680
            <span class="unit">km</span>
        </div>
    </div>

    <div class="grid">

        <div class="card">
            <div class="icon">🛠️</div>
            <div class="card-title">保養</div>
            <div class="card-text">
                最近一次<br>
                20,000 km
            </div>
        </div>

        <div class="card">
            <div class="icon">⛽</div>
            <div class="card-title">加油</div>
            <div class="card-text">
                最近一次<br>
                NT$ 1,250
            </div>
        </div>

        <div class="card">
            <div class="icon">🛞</div>
            <div class="card-title">輪胎</div>
            <div class="card-text">
                Continental<br>
                215/55 R17
            </div>
        </div>

        <div class="card">
            <div class="icon">⚠️</div>
            <div class="card-title">異常紀錄</div>
            <div class="card-text">
                目前沒有
            </div>
        </div>

    </div>

    <div class="section">

        <div class="section-title">
            本月花費
        </div>

        <div class="expense">
            <div class="expense-value">
                NT$ 3,250
            </div>

            <div class="expense-label">
                保養 + 加油 + 其他
            </div>
        </div>

    </div>

</div>
</html>
  <script src="app.js"></script>
</body>
</html>
